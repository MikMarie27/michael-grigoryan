<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edit the site — Michael Grigoryan</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#0e0d0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css?v=4">
</head>
<body>

<!-- ————— editor ————— -->
<div id="app" hidden>
  <header class="bar">
    <strong>Edit the site</strong>
    <span class="bar-who">signed in as <b id="who">…</b></span>
    <span class="bar-state" id="state"></span>
    <span class="bar-spacer"></span>
    <a class="ghost" href="../" target="_blank" rel="noopener">View site</a>
    <button class="ghost" id="signout" type="button">Sign out</button>
    <button class="primary" id="save" type="button">Publish</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="on" data-tab="works" type="button">Works</button>
    <button data-tab="about" type="button">About</button>
    <button data-tab="contact" type="button">Contact</button>
    <button data-tab="intro" type="button">Front page</button>
  </nav>

  <main>
    <section data-panel="works">
      <div class="panel-head">
        <h2>Works</h2>
        <button class="primary small" id="add" type="button">Add a work</button>
      </div>
      <p class="note">They appear on the site in this order. Newest first is usual.</p>
      <ol class="works" id="works"></ol>
    </section>

    <section data-panel="about" hidden>
      <h2>About</h2>
      <label>Opening line
        <textarea id="a-opening" rows="3"></textarea>
        <small>The large sentence at the top of the About section.</small>
      </label>
      <label>The rest
        <textarea id="a-paras" rows="20"></textarea>
        <small>Leave a blank line between paragraphs. Begin a paragraph with
        <b>&gt;</b> and a space to set it as Michael speaking — it appears as a
        quotation in his own voice.</small>
      </label>
      <h3>Facts</h3>
      <div id="facts"></div>
      <button class="ghost small" id="add-fact" type="button">Add a fact</button>
    </section>

    <section data-panel="contact" hidden>
      <h2>Contact</h2>
      <label>Line above the address
        <textarea id="c-line" rows="2"></textarea>
      </label>
      <label>Email address
        <input id="c-email" type="email" inputmode="email">
      </label>
      <h3>Links</h3>
      <div id="links"></div>
      <button class="ghost small" id="add-link" type="button">Add a link</button>
    </section>

    <section data-panel="intro" hidden>
      <h2>Front page</h2>
      <label>Name
        <input id="s-name" type="text">
      </label>
      <label>Line under the name
        <textarea id="s-lede" rows="2"></textarea>
      </label>
      <label>Small line under that
        <input id="s-meta" type="text">
      </label>
      <label>Button
        <input id="s-cta" type="text">
      </label>
      <h3>The film</h3>
      <label>Caption
        <input id="h-caption" type="text">
      </label>
      <label>Description for screen readers
        <textarea id="h-alt" rows="3"></textarea>
      </label>
      <p class="note">To replace the film itself, put a new <code>.mp4</code> and poster image in <code>media/</code> and update <code>content.json</code> — see <code>ADMIN.md</code>.</p>
    </section>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<template id="work-tpl">
  <li class="work">
    <div class="work-top">
      <img class="work-thumb" alt="">
      <div class="work-title">
        <strong data-role="heading"></strong>
        <span data-role="sub"></span>
      </div>
      <div class="work-move">
        <button class="ghost icon" data-act="up" type="button" aria-label="Move up">↑</button>
        <button class="ghost icon" data-act="down" type="button" aria-label="Move down">↓</button>
        <button class="ghost icon" data-act="toggle" type="button" aria-label="Edit">Edit</button>
      </div>
    </div>
    <div class="work-body" hidden>
      <label>Title <input data-f="title" type="text" lang="hy"></label>
      <label>Title in English <input data-f="titleEn" type="text"></label>
      <div class="row">
        <label>Year <input data-f="year" type="text" inputmode="numeric"></label>
        <label>Size <input data-f="size" type="text" placeholder="42 × 29.7 cm"></label>
      </div>
      <label>Medium <input data-f="medium" type="text"></label>
      <label>Description of the picture
        <textarea data-f="alt" rows="4"></textarea>
        <small>Read aloud to blind visitors and read by search engines. Describe what is in the picture.</small>
      </label>
      <label class="file">Replace the photograph
        <input data-act="file" type="file" accept="image/*">
        <small>Resized here in the browser. Photograph the work flat, in daylight, out of any frame.</small>
      </label>
      <div class="work-foot">
        <span class="slug" data-role="slug"></span>
        <button class="danger small" data-act="delete" type="button">Delete this work</button>
      </div>
    </div>
  </li>
</template>

<script src="admin.js?v=4"></script>
</body>
</html>
